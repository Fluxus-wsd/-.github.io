<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人网站</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f5f5f5; }
    header { background:#333; color:white; padding:20px; text-align:center; }
    nav { background:#555; padding:10px; text-align:center; }
    nav a { color:white; margin:0 15px; text-decoration:none; }
    nav a:hover { text-decoration:underline; }
    .container { padding:20px; max-width:900px; margin:auto; background:white; }
    .section { margin-bottom:40px; }
    h2 { border-bottom:2px solid #eee; padding-bottom:10px; }
    footer { text-align:center; padding:20px; background:#333; color:white; }
  </style>
</head>
<body>

<header>
  <h1>W SD 的个人网站</h1>
  <p>记录生活 & 分享专业</p>
</header>

<nav>
  <a href="#about">关于我</a>
  <a href="#blog">日常</a>
  <a href="#resume">简历</a>
  <a href="#contact">联系</a>
</nav>

<div class="container">

  <div id="about" class="section">
    <h2>关于我</h2>
    <p>这里写你的个人介绍，比如桥梁工程师、兴趣爱好等。</p>
  </div>

  <div id="blog" class="section">
    <h2>日常记录</h2>
    <ul id="posts">
      <li>2026-05-01：今天搭建了我的个人网站！</li>
    </ul>
    <input type="text" id="newPost" placeholder="写点今天的内容..." style="width:70%; padding:8px;">
    <button onclick="addPost()">发布</button>
  </div>

  <div id="resume" class="section">
    <h2>个人简历</h2>
    <p><strong>职业：</strong>桥梁设计工程师</p>
    <p><strong>经验：</strong>4年</p>
    <p><strong>技能：</strong>AASHTO、结构分析、混凝土设计</p>
  </div>

  <div id="contact" class="section">
    <h2>联系方式</h2>
    <p>Email: your@email.com</p>
  </div>

</div>

<footer>
  <p>© 2026 W SD</p>
</footer>

<script>
function addPost() {
  var input = document.getElementById("newPost");
  var text = input.value;
  if(text.trim() === "") return;

  var li = document.createElement("li");
  var date = new Date().toISOString().split('T')[0];
  li.textContent = date + "：" + text;

  document.getElementById("posts").prepend(li);
  input.value = "";
}
</script>

</body>
</html>
